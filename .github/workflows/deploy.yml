
name: CloudNexus Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudnexus-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package Website
        run: |
          tar -czf /tmp/cloudnexus-deploy.tar.gz site scripts

      - name: Upload Website
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/cloudnexus-deploy.tar.gz \
            deploy@"$DEPLOY_HOST":/tmp/cloudnexus-deploy.tar.gz

      - name: Prepare Server Staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            deploy@"$DEPLOY_HOST" \
            'mkdir -p /var/www/cloudnexus/staging &&
             tar -xzf /tmp/cloudnexus-deploy.tar.gz -C /var/www/cloudnexus/staging &&
             chmod +x /var/www/cloudnexus/staging/scripts/*.sh &&
             rm -f /tmp/cloudnexus-deploy.tar.gz'

      - name: Execute Deployment
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMIT_SHA: ${{ github.sha }}
          PUSHED_BY: ${{ github.actor }}
        run: |
          DEPLOY_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            deploy@"$DEPLOY_HOST" \
            "bash /var/www/cloudnexus/staging/scripts/deploy.sh '$COMMIT_SHA' '$PUSHED_BY' '$DEPLOY_TIME'"

      - name: Verify Live Website
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          DOMAIN="team-cloudnexus.test"

          echo "Checking http://$DOMAIN on $DEPLOY_HOST"

          for attempt in {1..5}; do
            if curl -fsS \
              --resolve "$DOMAIN:80:$DEPLOY_HOST" \
              "http://$DOMAIN/" \
              -o /tmp/cloudnexus-live.html; then

              if grep -q "$COMMIT_SHA" /tmp/cloudnexus-live.html; then
                echo "Deployment health check passed."
                exit 0
              fi
            fi

            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

          echo "ERROR: Website health check failed."
          exit 1

  notify:
    name: Slack Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          PUSHED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL is not configured yet."
            exit 0
          fi

          MESSAGE="CloudNexus deployment: ${DEPLOY_RESULT}
          Commit: ${COMMIT_SHA}
          Pushed by: ${PUSHED_BY}
          Workflow: ${RUN_URL}"

          PAYLOAD="$(jq -n --arg text "$MESSAGE" '{text: $text}')"

          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

