
name: Website CI Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  website-check:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Check Script Executable
        run: chmod +x scripts/check-site.sh

      - name: Run Website Validation
        run: bash scripts/check-site.sh site

